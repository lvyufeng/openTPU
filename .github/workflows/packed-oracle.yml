# SPDX-License-Identifier: Apache-2.0
name: Packed-byte oracle checks

on:
  push:
    paths:
      - 'tools/packed_oracle/**'
      - '.github/workflows/packed-oracle.yml'
      - 'THIRD_PARTY.md'
      - 'LICENSE'
  pull_request:
    paths:
      - 'tools/packed_oracle/**'
      - '.github/workflows/packed-oracle.yml'
      - 'THIRD_PARTY.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-oracle:
    name: Python ${{ matrix.python-version }} source-only oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib source-only unit tests
        run: python -B -S -m unittest discover -s tools/packed_oracle/tests -v
      - name: Verify shipped synthetic packed-byte fixture
        run: python -B -S -m tools.packed_oracle verify tools/packed_oracle/data/q2_q8_synthetic.json
      - name: Check deterministic independent regeneration
        shell: bash
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP:?}/q2_q8_regenerated.json"
          python -B -S -m tools.packed_oracle generate --stdout > "$generated"
          cmp tools/packed_oracle/data/q2_q8_synthetic.json "$generated"
      - name: Verify shipped IQ synthetic fixture
        run: python -B -S -m tools.packed_oracle iq-verify tools/packed_oracle/data/iq_synthetic.json
      - name: Check deterministic IQ regeneration
        shell: bash
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP:?}/iq_regenerated.json"
          python -B -S -m tools.packed_oracle iq-generate --stdout > "$generated"
          cmp tools/packed_oracle/data/iq_synthetic.json "$generated"
      - name: Verify shipped RTL integer vector bundle
        run: python -B -S -m tools.packed_oracle iq-rtl-verify tools/packed_oracle/data/iq_rtl_vectors.json
      - name: Check deterministic RTL integer vector regeneration
        shell: bash
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP:?}/iq_rtl_regenerated.json"
          python -B -S -m tools.packed_oracle iq-rtl-generate --stdout > "$generated"
          cmp tools/packed_oracle/data/iq_rtl_vectors.json "$generated"
